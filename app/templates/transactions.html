{% extends "base.html" %}
{% block title %}Transactions · Expense Tracker{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>Transactions</h1>
  <span class="spacer"></span>
  <a role="button" class="secondary outline" id="export-link" href="/api/transactions/export.csv" download>Export CSV</a>
  <button type="button" id="add-button">Add transaction</button>
</div>

<form class="toolbar" id="filters" aria-label="Filters">
  <label>
    <span class="visually-hidden">Month</span>
    <input type="month" name="month" aria-label="Month">
  </label>
  <button type="button" class="secondary outline icon-button" id="all-time">All time</button>
  <select name="type" aria-label="Type">
    <option value="">All types</option>
    <option value="expense">Expenses</option>
    <option value="income">Income</option>
  </select>
  <select name="category_id" aria-label="Category">
    <option value="">All categories</option>
  </select>
</form>

<p class="form-error" id="error" role="alert" hidden></p>
<p class="summary-line muted" id="summary" aria-live="polite">&nbsp;</p>

<div class="overflow-auto" id="table-wrap">
  <table class="striped">
    <thead>
      <tr><th>Date</th><th>Category</th><th class="col-note">Note</th><th class="num">Amount</th><th><span class="visually-hidden">Actions</span></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<p class="muted" id="empty" hidden>No transactions match these filters.</p>

<div class="pager">
  <span class="muted" id="page-info"></span>
  <button type="button" class="secondary outline" id="prev-page">Previous</button>
  <button type="button" class="secondary outline" id="next-page">Next</button>
</div>

<dialog id="editor">
  <article>
    <header>
      <button type="button" aria-label="Close" rel="prev" data-close></button>
      <h2 id="editor-title">Add transaction</h2>
    </header>
    <form id="editor-form">
      <p class="form-error" id="editor-error" role="alert" hidden></p>
      <div class="grid">
        <label>
          Date
          <input type="date" name="occurred_on" required>
        </label>
        <label>
          Amount (฿)
          <input type="text" name="amount" inputmode="decimal" pattern="\d{1,10}(\.\d{1,2})?" placeholder="0.00" required
                 title="A positive amount with up to 2 decimal places">
        </label>
      </div>
      <label>
        Category
        <select name="category_id" required></select>
      </label>
      <label>
        Note <small class="muted">(optional)</small>
        <input type="text" name="note" maxlength="200">
      </label>
      <footer>
        <button type="button" class="secondary" data-close>Cancel</button>
        <button type="submit">Save</button>
      </footer>
    </form>
  </article>
</dialog>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/transactions.js"></script>
{% endblock %}
